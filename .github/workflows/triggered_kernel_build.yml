            - name: init credentials
              run: |   
                cd ~      
                git config --global user.name "Kernel Buildbot"
                git config --global user.email "gh@buildbot.tvyiutnhisokewt"
            
            - name: checkout aosp kernel build system
              run: |
                cp buildscript ~ 
                cd ~
                mkdir kernel
                cp buildscript kernel
                cd kernel
                repo init -u https://android.googlesource.com/kernel/manifest.git -b android-gs-pantah-6.1-android16 --depth 1
            
            - name: hax because google gay
              run: |
                cd ~/kernel
                sed -i 's,android-gs-pantah-6.1-android16,refs/tags/android-16.0.0_r0.10,g' .repo/manifests/default.xml
                repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync

            - name: build gki
              run: |
                cd ~
                BUILD_TYPE=gki ./kernel/buildscript pantah

            - name: upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                 name: pantah_gki
